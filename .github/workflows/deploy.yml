name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail
            APP_DIR=/srv/apps/mojekytara.onremote.cz

            runuser -u www-data -- git -C "$APP_DIR" fetch --prune origin main
            runuser -u www-data -- git -C "$APP_DIR" checkout -B main origin/main
            runuser -u www-data -- env HOME="$APP_DIR" npm_config_cache="$APP_DIR/.npm" npm --prefix "$APP_DIR" ci
            runuser -u www-data -- env HOME="$APP_DIR" npm_config_cache="$APP_DIR/.npm" npm --prefix "$APP_DIR" run build

            systemctl restart vps-app-mojekytara-onremote-cz
            systemctl is-active --quiet vps-app-mojekytara-onremote-cz
            curl --fail --silent --show-error --retry 15 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:3001/ > /dev/null
